url: https://inkaverse.com/

home:
  title: Inkaverse
  description: Tools and Statistical Procedures in Plant Science
  links:
  - text: Support the project
    href: https://github.com/sponsors/flavjack

authors:
  Flavio Lozano-Isla:
    href: https://www.linkedin.com/in/flozanoisla/
  QuipoLab:
    href: https://www.quipolab.com/
    html: "<img src='https://inkaverse.com/img/quipolab.png' align='middle' width=70>"
  Inkaverse:
    href: https://inkaverse.com/
    html: "<img src='https://inkaverse.com/img/inkaverse.png' align='middle' width=70>"
  footer:
    roles: [cre]
    text: "Desarrollado por"
  sidebar:
    roles: [aut, ctb, cph]

template:
  bootstrap: 5
  bootswatch: sandstone
  math-rendering: mathjax
  light-switch: true
  params:
    ganalytics: G-804H2EJ8RN
  opengraph:
    image:
      src: man/figures/logo.png

development:
  mode: auto

destination: docs

navbar:
  bg: dark
  type: light
  structure:
    left: [intro, home, apps, design, analysis, writing, breeding, privacy, reference, news]
    right: [search, github, sponsor]
  components:
    home:
      icon: fa-home fa-lg
      href: index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/flavjack/inti/
    sponsor:
      icon: fas fa-heart fa-lg
      href: https://github.com/sponsors/Flavjack
    apps:
      text: "Apps"
      icon: fa-gamepad fa-lg
      href: articles/apps.html
    design:
      text: "DoE"
      icon: fa-book fa-lg
      menu:
        - text: "-------"
        - text: "Tarpuy: field-book experimental plans"
          href: articles/tarpuy.html
    
        - text: "-------"
        - text: "Single Factor Designs"
        - text: "DCA"
          href: articles/DoE-1_DCA.html
        - text: "RCBD"
          href: articles/DoE-1_RCBD.html
    
        - text: "-------"
        - text: "Two Factors Designs"
        - text: "DCA"
          href: articles/DoE-2_DCA.html
        - text: "RCBD"
          href: articles/DoE-2_RCBD.html
        - text: "Split-Plot in RCBD"
          href: articles/DoE-2_SPLIT.html
        - text: "Augmented in RCBD"
          href: articles/DoE-2_AUG.html
    
        - text: "-------"
        - text: "Three or More Factors Designs"
        - text: "DCA"
          href: articles/DoE-3_DCA.html
        - text: "RCBD"
          href: articles/DoE-3_RCBD.html
    
        - text: "-------"
    analysis:
      text: "Analysis"
      icon: fa-book fa-lg
      menu:
      - text: -------
      - text: "Yupana: experimental design analysis"
        href: articles/yupana.html
      - text: -------
      # - text: "Coding"
      #   href: articles/designs.html
      # - text: -------
    writing:
      text: "Writing"
      icon: fa-book fa-lg
      menu:
      - text: -------
      - text: "Rticles: scientific documents with R"
        href: articles/rticles.html
      - text: -------
    breeding:
      text: "Breeding"
      icon: fa-book fa-lg
      menu:
      - text: -------
      - text: "Broad-sense heritability in plant breeding"
        href: articles/heritability.html
      - text: -------
    privacy:
      text: "Privacy Policy"
      icon: fa-shield-alt fa-lg
      href: articles/policy.html
    reference:
      text: "Functions"
      icon: fa-file-code fa-lg
      href: reference/index.html
    news:
      text: "News"
      icon: fa-file-alt fa-lg
      href: news/index.html

reference:
- title: Yupana
  desc:  Data analysis
- contents:
  - starts_with("yupana")
  - starts_with("plot")
- title: Tarpuy
  desc:  Experimental designs
- contents:
  - starts_with("tarpuy")
- title: Rticles
  desc:  Write technical documents
- contents:
  - rticle
  - starts_with("include")
  - footnotes
  - web_table
- title: Plant breeding
  desc: Algorithms and calculations
- contents:
  - H2cal
  - metamorphosis
  - remove_outliers
  - mean_comparison
  - starts_with("design")
- title: Datasets
- contents:
  - potato 
  - met
- title: Miscellaneous
- contents:
  - split_folder
